# MyCloud Reverse Proxy Configuration (Port 80 -> Node.js 8080)
# Supports Local LAN (192.168.18.78), Tailscale (100.72.209.120), MagicDNS, and Funnel

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow giant file uploads up to 50GB without HTTP 413
    client_max_body_size 50G;

    # Direct streaming to backend without disk buffering bottleneck
    proxy_request_buffering off;
    proxy_buffering off;

    # Extended timeouts for large multi-GB chunks and streams (600 seconds)
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support (for Terminal PTY & real-time events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve client headers and IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

